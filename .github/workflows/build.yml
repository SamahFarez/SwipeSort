name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build
        run: |
          if [ -f SwipeSort.zip ]; then
            rm -rf _src && unzip -q SwipeSort.zip -d _src && ROOT=_src
          else
            ROOT=.
          fi
          SETTINGS=$(find "$ROOT" -name settings.gradle.kts -not -path '*/build/*' | head -1)
          if [ -z "$SETTINGS" ]; then echo "settings.gradle.kts not found. Files in repo:"; find . -not -path './.git/*' | head -100; exit 1; fi
          cd "$(dirname "$SETTINGS")"
          echo "Building in $(pwd)"
          gradle assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/SwipeSort.apk"
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "build-${{ github.run_number }}" SwipeSort.apk --title "SwipeSort ${{ github.run_number }}" --notes "Tap SwipeSort.apk to download"
